<!DOCTYPE html>
<!-- Original generated drink sprites, embedded so a file:// open is not tainted. Procedural canvas draw is fallback only. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>루미</title>
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: linear-gradient(#ffd0b8, #ffb4c6 42%, #f0c4ea 72%, #cfe6ff);
    overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; z-index: 1; }
  #pixi { position: fixed; left: 0; top: 0; touch-action: none; pointer-events: none; z-index: 2; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="pixi"></canvas>
<script src="vendor/pixi.min.js"></script>
<script>
'use strict';
(function () {
  const COLS = 8, ROWS = 8, TYPES = 6;
  const T_APPLE = 0, T_STRAW = 1, T_LEMON = 2, T_ORANGE = 3, T_BANANA = 4, T_MELON = 5;
  const FRUIT_KO = ['에스프레소', '라떼', '아이스아메리카노', '오렌지에이드', '레몬티', '바나나우유'];
  // Levels 1–3 stay on these numbers. 4–8 add a different mix. 상자 is a
  // fixed crate: it does not fall or swap, and breaks when a neighboring
  // fruit clears or a special hits it.
  const LEVELS = [
    { straw: 12, melon: 0, ice: 0, moves: 18 },
    { straw: 0, melon: 10, ice: 4, moves: 24 },
    { straw: 8, melon: 8, ice: 0, moves: 22 },
    { orange: 12, ice: 5, moves: 24 },
    { lemon: 10, crate: 6, moves: 26 },
    { apple: 8, banana: 8, moves: 24 },
    { straw: 6, orange: 8, crate: 4, moves: 26 },
    { melon: 8, banana: 8, ice: 4, moves: 28 }
  ];
  const SP_NONE = 0, SP_H = 1, SP_V = 2, SP_BOMB = 3, SP_RAIN = 4;
  const FONT = '"NanumGothic","Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif';
  const PALETTE = [
    { hi:'#f3e2cc', mid:'#6a3a22', dk:'#3a1e12', edge:'#c4a882', glow:'rgba(106,58,34,0.55)' },
    { hi:'#fff6ea', mid:'#e7c7a2', dk:'#c49a6c', edge:'#a07848', glow:'rgba(196,154,108,0.5)' },
    { hi:'#d7eef5', mid:'#4a342c', dk:'#2a1c18', edge:'#8ec4d4', glow:'rgba(74,52,44,0.5)' },
    { hi:'#ffe0b0', mid:'#ff8a1a', dk:'#e25a00', edge:'#c44800', glow:'rgba(255,138,26,0.5)' },
    { hi:'#fff6c4', mid:'#ffd24a', dk:'#e0a820', edge:'#c89018', glow:'rgba(255,210,74,0.5)' },
    { hi:'#fff8dc', mid:'#ffe08a', dk:'#f0c85a', edge:'#e0b050', glow:'rgba(255,224,138,0.5)' }
  ];
  const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

  let gid = 1;
  let board = [];
  let phase = 'idle';
  let levelIndex = 0;
  let needStraw = LEVELS[0].straw, needMelon = LEVELS[0].melon, needIce = LEVELS[0].ice || 0;
  let needFruit = [0, LEVELS[0].straw, 0, 0, 0, 0];
  let gotFruit = [0, 0, 0, 0, 0, 0];
  let needCrate = 0, gotCrate = 0, cratePop = 0;
  let fruitPop = [0, 0, 0, 0, 0, 0];
  // Two uses of the hammer and one +5, refilled each attempt. Neither spends a move.
  let hammers = 2, plusLeft = 1, boosterArm = '';
  let cardLeft = 0;
  let directClear = false;
  let winStars = 0;
  // Stars and unlocks persist across reload. Score does not. Level 1 starts open.
  const PROGRESS_KEY = 'lumi-map-v1';
  let unlocked = 1;
  let bestStars = [0, 0, 0, 0, 0, 0, 0, 0];
  let holdProgress = false;
  let hoverMap = -1;
  let hoverHammer = false, hoverPlus = false;
  let score = 0, shownScore = 0, moves = LEVELS[0].moves, combo = 1;
  let levelStartScore = 0;
  let selected = null, drag = null, hint = null, idleMs = 0, swapCtx = null;
  // One swap remembered during pop, fall, or refill. A later drag in that same resolve replaces it.
  let queuedSwap = null, queueFate = '';
  // First-session coach. Stays off after the first swap until a full reload.
  let taught = false;
  let coachSpace = false;
  let pendingSpecs = [], forcedFx = null, doomSet = new Set();
  // Special clears leave holes briefly so the empty row/column is visible before refill.
  let wantGap = false, gapMs = 0;
  let particles = [], floaters = [], rings = [], banner = null;
  let cellFlashes = [];
  let telegraphs = [];
  let shake = 0, clearShakeT = 0, flash = 0, movesPop = 0, strawPop = 0, melonPop = 0, icePop = 0, scorePop = 0, endAt = 0;
  let scoreCarry = 0;
  let gotStraw = 0, gotMelon = 0, gotIce = 0;
  let goalPips = [];
  // One completion banner per goal per attempt. Reset with the attempt, not on extra fruit.
  let goalTold = { straw: false, melon: false, ice: false };
  let goalQueue = [];
  let goalBannerLog = [];
  // Last-moves urgency: one cue per threshold crossing per attempt.
  let urgeTold = { at3: false, at1: false };
  // hit-stop: freeze-frame juice on clear impact (~30–120ms) for solid force readability
  let hitStop = 0;
  let muted = false, actx = null;
  let canvas, ctx, W = 800, H = 600, dpr = 1;
  let ox = 0, oy = 0, cell = 48, boardPx = 384, hudH = 136, narrow = false, topOffset = 0;
  let frame = { x: 0, y: 0, w: 420, h: 640, r: 34 };
  let padX = 16, padTop = 14, boardGap = 10;
  let ui = { mute: null, replay: null, hammer: null, plus: null, fruitNum: [] };
  let hoverReplay = false;
  let hoverStart = false;
  let lastNow = 0, frameNow = 0;
  let pointer = { x: 0, y: 0 };
  let hover = null;
  let life = null, lifeWait = 0;
  // Null rng keeps Math.random. A seed is only for the headless balance runs.
  let rng = null;
  function rand() { return rng ? rng() : Math.random(); }
  function mulberry32(seed) {
    let s = seed >>> 0;
    function next() {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    next.getState = function () { return s; };
    next.setState = function (v) { s = v >>> 0; };
    return next;
  }

  function makeGem(r, c, type) {
    return { id: gid++, type: type, look: -1, special: SP_NONE, ice: false, crate: false, r: r, c: c, anim: null };
  }
  function keyOf(r, c) { return r + ',' + c; }
  function inb(r, c) { return r >= 0 && c >= 0 && r < ROWS && c < COLS; }
  function forEachGem(fn) {
    for (let r = 0; r < ROWS; r++) {
      if (!board[r]) continue;
      for (let c = 0; c < COLS; c++) {
        const g = board[r][c];
        if (g) fn(g, r, c);
      }
    }
  }
  function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }

  function unlockAudio() {
    if (muted) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) {
      try { actx = new AC(); } catch (e) { return; }
    }
    if (actx.state === 'suspended') actx.resume();
  }
  function tone(freq, dur, type, gain, when) {
    if (muted || !actx) return;
    try {
      const t = actx.currentTime + (when || 0);
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(Math.max(0.0001, gain), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  }
  function playIce() {
    tone(740, 0.05, 'sine', 0.022, 0);
    tone(1180, 0.07, 'triangle', 0.014, 0.02);
  }
  function playPop(mult) {
    const f = 500 + (mult || 1) * 28;
    tone(f, 0.07, 'sine', 0.032, 0);
    tone(f * 1.5, 0.05, 'triangle', 0.016, 0.018);
  }
  // One short soft note per clear in a chain. Steps 1–6 of a major scale; later steps stay on the 6th.
  function playMatch(step) {
    var semis = [0, 2, 4, 5, 7, 9];
    var n = step | 0;
    if (n < 1) n = 1;
    if (n > 6) n = 6;
    tone(440 * Math.pow(2, semis[n - 1] / 12), 0.08, 'sine', 0.024, 0);
  }
  function playThud() {
    tone(128, 0.12, 'sine', 0.04, 0);
    tone(84, 0.15, 'triangle', 0.02, 0.012);
  }
  // Soft quiet tick when moves first hit 3 (urgency escalate, not a thud).
  function playUrgeTick() {
    tone(640, 0.04, 'sine', 0.016, 0);
    tone(480, 0.055, 'triangle', 0.009, 0.012);
  }
  function playSpecial() {
    [523, 659, 784, 1046].forEach(function (f, i) {
      tone(f, 0.11, 'triangle', 0.028, i * 0.055);
    });
  }
  // Short rising tone when a special is created (not when one merely clears).
  function playCrate() {
    tone(196, 0.07, 'square', 0.018, 0);
    tone(110, 0.1, 'triangle', 0.026, 0.018);
  }
  function playCreate() {
    if (muted || !actx) return;
    try {
      const t = actx.currentTime;
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(392, t);
      o.frequency.exponentialRampToValueAtTime(1318, t + 0.16);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.045, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.22);
    } catch (e) {}
  }

  function countDir(r, c, type, dr, dc) {
    let n = 0, rr = r + dr, cc = c + dc;
    while (inb(rr, cc)) {
      const g = board[rr][cc];
      if (!g || g.type !== type) break;
      n++; rr += dr; cc += dc;
    }
    return n;
  }
  function wouldMatch(r, c, type) {
    if (type < 0) return false;
    const h = countDir(r, c, type, 0, -1) + countDir(r, c, type, 0, 1);
    const v = countDir(r, c, type, -1, 0) + countDir(r, c, type, 1, 0);
    return h >= 2 || v >= 2;
  }
  function chooseType(r, c) {
    const opts = [];
    for (let t = 0; t < TYPES; t++) if (!wouldMatch(r, c, t)) opts.push(t);
    if (!opts.length) for (let t = 0; t < TYPES; t++) opts.push(t);
    return opts[(rand() * opts.length) | 0];
  }
  function findRuns() {
    const runs = [];
    for (let r = 0; r < ROWS; r++) {
      let c = 0;
      while (c < COLS) {
        const g = board[r][c];
        if (!g || g.type < 0) { c++; continue; }
        let c2 = c + 1;
        while (c2 < COLS && board[r][c2] && board[r][c2].type === g.type) c2++;
        if (c2 - c >= 3) {
          const cells = [];
          for (let k = c; k < c2; k++) cells.push({ r: r, c: k });
          runs.push({ dir: 'h', cells: cells });
        }
        c = c2;
      }
    }
    for (let c = 0; c < COLS; c++) {
      let r = 0;
      while (r < ROWS) {
        const g = board[r][c];
        if (!g || g.type < 0) { r++; continue; }
        let r2 = r + 1;
        while (r2 < ROWS && board[r2][c] && board[r2][c].type === g.type) r2++;
        if (r2 - r >= 3) {
          const cells = [];
          for (let k = r; k < r2; k++) cells.push({ r: k, c: c });
          runs.push({ dir: 'v', cells: cells });
        }
        r = r2;
      }
    }
    return runs;
  }
  function hasMatch() { return findRuns().length > 0; }
  function swapCells(r1, c1, r2, c2) {
    const a = board[r1][c1], b = board[r2][c2];
    board[r1][c1] = b; board[r2][c2] = a;
    if (a) { a.r = r2; a.c = c2; }
    if (b) { b.r = r1; b.c = c1; }
  }
  function findHint() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      for (let d = 0; d < 2; d++) {
        const r2 = r + (d === 1 ? 1 : 0), c2 = c + (d === 0 ? 1 : 0);
        if (!inb(r2, c2)) continue;
        const g1 = board[r][c], g2 = board[r2][c2];
        if (!g1 || !g2 || g1.crate || g2.crate) continue;
        if (g1.special === SP_RAIN || g2.special === SP_RAIN || pairCombo(g1, g2)) return [{ r: r, c: c }, { r: r2, c: c2 }];
        swapCells(r, c, r2, c2);
        const ok = hasMatch();
        swapCells(r, c, r2, c2);
        if (ok) return [{ r: r, c: c }, { r: r2, c: c2 }];
      }
    }
    return null;
  }
  // Level 1, before any swap this visit. Not level 2/3, not a retry after a swap.
  // The intro card is excluded so it does not sit on top of the coach line.
  function showCoach() {
    return !taught && levelIndex === 0
      && phase !== 'ready' && phase !== 'win' && phase !== 'lose'
      && phase !== 'card' && phase !== 'map';
  }
  // One legal swap: two orthogonally adjacent pieces. A strawberry clear
  // only counts when that swap itself is a single adjacent pair.
  function adjacentPair(a, b) {
    return a && b && Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
  }
  function findCoachHint() {
    let any = null;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      for (let d = 0; d < 2; d++) {
        const r2 = r + (d === 1 ? 1 : 0), c2 = c + (d === 0 ? 1 : 0);
        if (!inb(r2, c2)) continue;
        if (Math.abs(r - r2) + Math.abs(c - c2) !== 1) continue;
        const n = moveStrawScore(r, c, r2, c2);
        if (n < 0) continue;
        const pair = [{ r: r, c: c }, { r: r2, c: c2 }];
        if (!adjacentPair(pair[0], pair[1])) continue;
        if (n > 0) return pair;
        if (!any) any = pair;
      }
    }
    return any;
  }
  function armCoach() {
    if (phase !== 'idle' || !showCoach()) return;
    hint = findCoachHint();
  }
  function sameCell(a, b) { return a && b && a.r === b.r && a.c === b.c; }
  function pickCell(cells, primary, secondary) {
    for (let i = 0; i < cells.length; i++) if (sameCell(cells[i], primary)) return cells[i];
    for (let i = 0; i < cells.length; i++) if (sameCell(cells[i], secondary)) return cells[i];
    if (primary) {
      const sorted = cells.slice().sort(function (a, b) {
        const da = Math.abs(a.r - primary.r) + Math.abs(a.c - primary.c);
        const db = Math.abs(b.r - primary.r) + Math.abs(b.c - primary.c);
        return da - db;
      });
      return sorted[0];
    }
    return cells[(cells.length / 2) | 0];
  }
  function planSpecials(runs, primary, secondary) {
    const inRun = new Map();
    const matched = new Set();
    for (let i = 0; i < runs.length; i++) {
      const run = runs[i];
      for (let j = 0; j < run.cells.length; j++) {
        const cell = run.cells[j];
        const k = keyOf(cell.r, cell.c);
        matched.add(k);
        if (!inRun.has(k)) inRun.set(k, []);
        inRun.get(k).push(run);
      }
    }
    const seen = new Set();
    const specs = [];
    matched.forEach(function (start) {
      if (seen.has(start)) return;
      const cluster = [];
      const q = [start];
      seen.add(start);
      while (q.length) {
        const k = q.pop();
        cluster.push(k);
        const parts = k.split(',');
        const r = +parts[0], c = +parts[1];
        for (let d = 0; d < 4; d++) {
          const nk = keyOf(r + DIRS[d][0], c + DIRS[d][1]);
          if (matched.has(nk) && !seen.has(nk)) { seen.add(nk); q.push(nk); }
        }
      }
      const used = new Set();
      const cruns = [];
      for (let i = 0; i < cluster.length; i++) {
        const rs = inRun.get(cluster[i]);
        for (let j = 0; j < rs.length; j++) if (!used.has(rs[j])) { used.add(rs[j]); cruns.push(rs[j]); }
      }
      const long = cruns.filter(function (rn) { return rn.cells.length >= 5; })
        .sort(function (a, b) { return b.cells.length - a.cells.length; });
      if (long.length) {
        const pos = pickCell(long[0].cells, primary, secondary);
        specs.push({ r: pos.r, c: pos.c, kind: SP_RAIN });
        return;
      }
      const inter = [];
      for (let i = 0; i < cluster.length; i++) {
        const k = cluster[i];
        const rs = inRun.get(k);
        const hs = rs.filter(function (rn) { return rn.dir === 'h' && rn.cells.length >= 3; });
        const vs = rs.filter(function (rn) { return rn.dir === 'v' && rn.cells.length >= 3; });
        if (!hs.length || !vs.length) continue;
        hs.sort(function (a, b) { return b.cells.length - a.cells.length; });
        vs.sort(function (a, b) { return b.cells.length - a.cells.length; });
        const u = new Set();
        hs[0].cells.forEach(function (cell) { u.add(keyOf(cell.r, cell.c)); });
        vs[0].cells.forEach(function (cell) { u.add(keyOf(cell.r, cell.c)); });
        if (u.size >= 5) inter.push(k);
      }
      if (inter.length) {
        const cells = inter.map(function (k) {
          const p = k.split(','); return { r: +p[0], c: +p[1] };
        });
        const pos = pickCell(cells, primary, secondary);
        specs.push({ r: pos.r, c: pos.c, kind: SP_BOMB });
        return;
      }
      const fours = cruns.filter(function (rn) { return rn.cells.length >= 4; })
        .sort(function (a, b) { return b.cells.length - a.cells.length; });
      if (fours.length) {
        const run = fours[0];
        const pos = pickCell(run.cells, primary, secondary);
        specs.push({ r: pos.r, c: pos.c, kind: run.dir === 'h' ? SP_H : SP_V });
      }
    });
    return specs;
  }
  function areaKeys(g, r, c) {
    const keys = [];
    if (g.special === SP_H) {
      for (let cc = 0; cc < COLS; cc++) keys.push(keyOf(r, cc));
    } else if (g.special === SP_V) {
      for (let rr = 0; rr < ROWS; rr++) keys.push(keyOf(rr, c));
    } else if (g.special === SP_BOMB) {
      for (let rr = r - 1; rr <= r + 1; rr++) for (let cc = c - 1; cc <= c + 1; cc++) {
        if (inb(rr, cc)) keys.push(keyOf(rr, cc));
      }
    } else if (g.special === SP_RAIN) {
      const colors = [];
      for (let rr = 0; rr < ROWS; rr++) for (let cc = 0; cc < COLS; cc++) {
        const o = board[rr][cc];
        if (o && o.type >= 0 && colors.indexOf(o.type) < 0) colors.push(o.type);
      }
      if (colors.length) {
        const color = colors[(rand() * colors.length) | 0];
        for (let rr = 0; rr < ROWS; rr++) for (let cc = 0; cc < COLS; cc++) {
          const o = board[rr][cc];
          if (o && o.type === color) keys.push(keyOf(rr, cc));
        }
      }
    }
    return keys;
  }
  function collectClears(seeds, preserve, fx, acts) {
    const doomed = new Set();
    const activated = new Set();
    const visited = new Set();
    const queue = seeds.slice();
    while (queue.length) {
      const key = queue.pop();
      if (visited.has(key)) continue;
      visited.add(key);
      const parts = key.split(',');
      const r = +parts[0], c = +parts[1];
      if (!inb(r, c)) continue;
      const g = board[r][c];
      if (g && g.special && !activated.has(g.id)) {
        activated.add(g.id);
        let sk = null;
        if (g.special === SP_H) { fx.stripe = true; sk = 'h'; }
        else if (g.special === SP_V) { fx.stripe = true; sk = 'v'; }
        else if (g.special === SP_BOMB) { fx.bomb = true; sk = 'bomb'; }
        else if (g.special === SP_RAIN) { fx.rain = true; sk = 'rain'; }
        const extra = areaKeys(g, r, c);
        if (acts && sk) {
          let color = null;
          let cells = null;
          if (sk === 'rain') {
            cells = [];
            color = -1;
            for (let ei = 0; ei < extra.length; ei++) {
              const ep = extra[ei].split(',');
              const er = +ep[0], ec = +ep[1];
              cells.push({ r: er, c: ec });
              if (color < 0) {
                const og = board[er] && board[er][ec];
                if (og && og.type >= 0) color = og.type;
              }
            }
          }
          acts.push({ kind: sk, r: r, c: c, color: color, cells: cells });
        }
        for (let i = 0; i < extra.length; i++) queue.push(extra[i]);
      }
      if (preserve.has(key) || !g) continue;
      doomed.add(key);
    }
    return doomed;
  }
  // Brief power-identity overlay so the player sees WHICH special is firing
  // before the board clears into particle noise.
  function spawnTelegraphs(acts, fx, seeds) {
    const baseDur = 180;
    for (let i = 0; i < acts.length; i++) {
      const a = acts[i];
      telegraphs.push({
        kind: a.kind,
        r: a.r,
        c: a.c,
        t: 0,
        dur: a.kind === 'rain' ? 200 : (a.kind === 'bomb' ? 190 : baseDur),
        color: a.color != null ? a.color : -1,
        cells: a.cells || null
      });
    }

    },
    pose: function (r, c) {

      var a = g.anim;
      return {
        r: Math.round(v.r * 1000) / 1000,
        c: Math.round(v.c * 1000) / 1000,
        sc: Math.round(v.sc * 1000) / 1000,
        sx: Math.round(v.sx * 1000) / 1000,

    },
    legalAt: function (r, c, r2, c2) {
      if (!inb(r, c) || !inb(r2, c2)) return false;
      if (Math.abs(r - r2) + Math.abs(c - c2) !== 1) return false;
      const a = board[r][c], b = board[r2][c2];

    },
    findPlain: function (type) {
      var hit = null;

    },
    plant: function (r, c, kind) {

    paint: function (types) {
      for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {

      }

    clearNow: function () { beginClear(false); },
    setIce: function (r, c, on) {

      var matched = {};

        var cells = runs[i].cells;

      }

    },
    spendMove: function () { spendMove(); return { moves: moves, urgeTold: { at3: !!urgeTold.at3, at1: !!urgeTold.at1 }, banner: banner ? banner.text : null }; },

        unlocked = 1;

        gotStraw = needStraw;
        moves = 2;
        goIdle();

        unlocked = 1;
        bootSeeded(0, 3);
        moves = 0;
        gotStraw = 0;

        levelStartScore = 25;

        check('retry_card', phase === 'card' && cardLeft > 0);
        check('boosters_refilled', hammers === 2 && plusLeft === 1);

        phase = 'clear';
        hammers = 2;

        moves = 4;

  };

  if (typeof document !== 'undefined') boot();
  if (typeof location !== 'undefined' && location.hash === '#test') {
    (function runTestWhenReady(tries) {
      var spr = window.__lumi.testFruitSprites && window.__lumi.testFruitSprites();
